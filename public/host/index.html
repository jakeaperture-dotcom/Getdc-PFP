<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="An unlisted classroom message wall." />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/png" sizes="64x64" href="../assets/favicon.png" />
    <link
      rel="preload"
      href="../assets/fonts/manrope-latin-variable.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="./host.css?v=20260820-3" />
    <title>Class Wall</title>
    <script src="./host.js?v=20260820-3" defer></script>
  </head>
  <body>
    <aside class="utility-rail" aria-label="Chat tools">
      <button id="settings-button" type="button" aria-label="Settings" title="Settings">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z" />
          <path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-2.8 2.8-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6v.2h-4V21a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1L4.2 17l.1-.1a1.7 1.7 0 0 0 .3-1.9A1.7 1.7 0 0 0 3 14H2.8v-4H3a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9L4.2 7 7 4.2l.1.1a1.7 1.7 0 0 0 1.9.3A1.7 1.7 0 0 0 10 3v-.2h4V3a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1L19.8 7l-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.6 1h.2v4H21a1.7 1.7 0 0 0-1.6 1Z" />
        </svg>
      </button>
      <button
        id="compact-window-button"
        type="button"
        aria-label="Open compact window"
        title="Open compact window"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="4" y="5" width="16" height="14" rx="2" />
          <path d="M13 5v14" />
        </svg>
      </button>
    </aside>

    <main class="chat-shell">
      <section class="chat-stream" id="chat-stream" aria-label="Class messages">
        <div class="presence" id="live-status" data-state="connecting" title="Connecting">
          <span aria-hidden="true"></span>
          <span class="sr-only">Connecting</span>
        </div>

        <div class="feed-status" id="feed-status" role="status">
          <span class="spinner" aria-hidden="true"></span>
          <span>Loading</span>
        </div>

        <div
          class="message-list"
          id="post-grid"
          role="log"
          aria-live="polite"
          aria-relevant="additions"
        ></div>
      </section>

      <p class="typing-status" id="typing-status" role="status" hidden></p>

      <form
        class="composer"
        id="post-form"
        enctype="multipart/form-data"
        novalidate
      >
        <div class="composer-trays">
          <div class="reply-tray" id="reply-tray" hidden>
            <span class="reply-mark" aria-hidden="true">↩</span>
            <span class="reply-copy">
              <strong id="reply-author"></strong>
              <small id="reply-message"></small>
            </span>
            <button id="cancel-reply" type="button" aria-label="Cancel reply">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="m6 6 12 12M18 6 6 18" />
              </svg>
            </button>
          </div>

          <div class="attachment-tray" id="selected-file" hidden>
            <button
              class="attachment-preview"
              id="selected-file-preview"
              type="button"
              aria-label="Preview selected image"
              hidden
            >
              <img id="selected-file-image" alt="" />
            </button>
            <span class="attachment-type" id="selected-file-type">FILE</span>
            <span class="attachment-copy">
              <strong id="selected-file-name"></strong>
              <small id="selected-file-size"></small>
            </span>
            <button id="remove-file" type="button" aria-label="Remove selected file">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="m6 6 12 12M18 6 6 18" />
              </svg>
            </button>
          </div>

          <p class="form-error" id="form-error" role="alert" hidden></p>
        </div>

        <label class="attach-button" for="file" title="Attach a file">
          <span class="sr-only">Attach a file</span>
          <input id="file" name="file" type="file" />
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="m20.5 11.5-8.4 8.4a6 6 0 0 1-8.5-8.5l9.2-9.2a4 4 0 0 1 5.7 5.7l-9.2 9.2a2 2 0 1 1-2.8-2.8l8.5-8.5" />
          </svg>
        </label>

        <label class="message-field" for="message">
          <span class="sr-only">Message</span>
          <textarea
            id="message"
            name="message"
            maxlength="6000"
            rows="1"
            placeholder="Message"
          ></textarea>
        </label>

        <label class="name-field" for="author">
          <span class="sr-only">Your name</span>
          <input
            id="author"
            name="author"
            type="text"
            maxlength="40"
            autocomplete="nickname"
            placeholder="Name"
            title="Your name"
          />
        </label>

        <button class="send-button" id="post-button" type="submit" aria-label="Send">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="m4 12 16-8-5.5 16-3-6.5L4 12Z" />
            <path d="m11.5 13.5 4-4" />
          </svg>
        </button>
      </form>
    </main>

    <div class="message-menu" id="message-menu" role="menu" hidden>
      <button id="reply-message-action" type="button" role="menuitem">Reply</button>
      <button id="delete-message-action" type="button" role="menuitem">Delete</button>
    </div>

    <dialog class="settings-dialog" id="settings-dialog" aria-labelledby="settings-title">
      <div class="settings-heading">
        <strong id="settings-title">Settings</strong>
        <button id="close-settings" type="button" aria-label="Close settings" title="Close">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="m6 6 12 12M18 6 6 18" />
          </svg>
        </button>
      </div>

      <section class="settings-section" aria-labelledby="friday-settings-title">
        <div class="settings-section-heading">
          <strong id="friday-settings-title">Friday</strong>
          <span title="Ask in chat with @Friday" aria-label="Ask in chat with at Friday">@</span>
        </div>

        <label class="settings-field" for="friday-admin-key">
          <span>Admin key</span>
          <input
            id="friday-admin-key"
            type="password"
            autocomplete="off"
            spellcheck="false"
          />
        </label>

        <div class="knowledge-row">
          <label class="icon-button" for="knowledge-file" title="Choose reference">
            <span class="sr-only">Choose a reference document</span>
            <input
              id="knowledge-file"
              type="file"
              accept=".pdf,.docx,.xlsx,.xls,.csv,.html,.htm,.txt,.md,.png,.jpg,.jpeg,.webp,.svg,.xml,.odt,.ods"
            />
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 3v12m0-12L8 7m4-4 4 4M5 14v5h14v-5" />
            </svg>
          </label>
          <span class="knowledge-file-name" id="knowledge-file-name">No reference selected</span>
          <button
            class="icon-button"
            id="index-document"
            type="button"
            aria-label="Add reference to Friday"
            title="Add to Friday"
            disabled
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 5v14M5 12h14" />
            </svg>
          </button>
        </div>
        <p class="knowledge-status" id="knowledge-status" role="status"></p>
        <ul class="knowledge-list" id="knowledge-list" aria-label="Friday references"></ul>
      </section>
    </dialog>

    <dialog id="image-dialog" aria-label="Image preview">
      <div class="dialog-actions">
        <a id="dialog-download" href="" aria-label="Download image" title="Download">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 4v11m0 0-4-4m4 4 4-4M5 20h14" />
          </svg>
        </a>
        <button id="close-dialog" type="button" aria-label="Close image preview">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="m6 6 12 12M18 6 6 18" />
          </svg>
        </button>
      </div>
      <img id="dialog-image" alt="" />
    </dialog>
  </body>
</html>
