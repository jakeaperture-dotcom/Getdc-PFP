<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="An unlisted classroom message wall." />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/png" sizes="64x64" href="../assets/favicon.png" />
    <link
      rel="preload"
      href="../assets/fonts/manrope-latin-variable.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="./host.css?v=20260819-4" />
    <title>Class Wall</title>
    <script src="./host.js?v=20260819-4" defer></script>
  </head>
  <body>
    <main class="chat-shell">
      <section class="chat-stream" id="chat-stream" aria-label="Class messages">
        <div class="presence" id="live-status" data-state="connecting" title="Connecting">
          <span aria-hidden="true"></span>
          <span class="sr-only">Connecting</span>
        </div>

        <div class="feed-status" id="feed-status" role="status">
          <span class="spinner" aria-hidden="true"></span>
          <span>Loading</span>
        </div>

        <div
          class="message-list"
          id="post-grid"
          role="log"
          aria-live="polite"
          aria-relevant="additions"
        ></div>
      </section>

      <form
        class="composer"
        id="post-form"
        enctype="multipart/form-data"
        novalidate
      >
        <div class="attachment-tray" id="selected-file" hidden>
          <button
            class="attachment-preview"
            id="selected-file-preview"
            type="button"
            aria-label="Preview selected image"
            hidden
          >
            <img id="selected-file-image" alt="" />
          </button>
          <span class="attachment-type" id="selected-file-type">FILE</span>
          <span class="attachment-copy">
            <strong id="selected-file-name"></strong>
            <small id="selected-file-size"></small>
          </span>
          <button id="remove-file" type="button" aria-label="Remove selected file">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="m6 6 12 12M18 6 6 18" />
            </svg>
          </button>
        </div>

        <p class="form-error" id="form-error" role="alert" hidden></p>

        <label class="attach-button" for="file" title="Attach a file">
          <span class="sr-only">Attach a file</span>
          <input id="file" name="file" type="file" />
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="m20.5 11.5-8.4 8.4a6 6 0 0 1-8.5-8.5l9.2-9.2a4 4 0 0 1 5.7 5.7l-9.2 9.2a2 2 0 1 1-2.8-2.8l8.5-8.5" />
          </svg>
        </label>

        <label class="message-field" for="message">
          <span class="sr-only">Message</span>
          <textarea
            id="message"
            name="message"
            maxlength="1200"
            rows="1"
            placeholder="Message"
          ></textarea>
        </label>

        <label class="name-field" for="author">
          <span class="sr-only">Your name</span>
          <input
            id="author"
            name="author"
            type="text"
            maxlength="40"
            autocomplete="nickname"
            placeholder="Name"
            title="Your name"
          />
        </label>

        <button class="send-button" id="post-button" type="submit" aria-label="Send">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="m4 12 16-8-5.5 16-3-6.5L4 12Z" />
            <path d="m11.5 13.5 4-4" />
          </svg>
        </button>
      </form>
    </main>

    <dialog id="image-dialog" aria-label="Image preview">
      <div class="dialog-actions">
        <a id="dialog-download" href="" aria-label="Download image" title="Download">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 4v11m0 0-4-4m4 4 4-4M5 20h14" />
          </svg>
        </a>
        <button id="close-dialog" type="button" aria-label="Close image preview">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="m6 6 12 12M18 6 6 18" />
          </svg>
        </button>
      </div>
      <img id="dialog-image" alt="" />
    </dialog>
  </body>
</html>
